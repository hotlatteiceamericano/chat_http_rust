[package]
name = "chat_http_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
lettre = "0.11.19"
serde = {version = "1.0.228", features=["derive"]}
serde_json = "1.0.149"
tokio = {version="1.50.0", features=["full"]}
tracing = "0.1"
tracing-subscriber = { version="0.3" , features=["env-filter"]}
ratatui = "0.30.0"
chat_common = {git="https://github.com/hotlatteiceamericano/chat_common"}
mongodb = "3.5.2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
chrono = "0.4"

[dev-dependencies]
rstest = "0.26.1"
axum-test = "18.7.0"
testcontainers = "0.24"
